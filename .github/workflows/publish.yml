name: Publish to npm and GitHub Releases

on:
  push:
    tags: [v*]
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # npm Trusted Publisher: Unnori/cortico-world-wechat-claw, publish.yml, npm.
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: npm-package

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Update npm for Trusted Publishing
        run: npm install --global 'npm@^11.5.1'

      - name: Create or update GitHub Release from changelog
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archives=(npm-package/*.tgz)
          if [[ ${#archives[@]} -ne 1 || ! -f "${archives[0]}" ]]; then
            echo 'Expected exactly one verified npm archive' >&2
            exit 1
          fi
          version="$(tar -xOf "${archives[0]}" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          release_tag="v$version"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" != "$release_tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v version="$version" '
            $0 == "## " version { found=1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          if [[ ! -s "$notes_file" ]]; then
            echo "No changelog section found for $version" >&2
            exit 1
          fi
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${archives[0]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$release_tag" "${archives[0]}" --repo "$GITHUB_REPOSITORY" --title "wechat-claw $version" --notes-file "$notes_file"
          fi

      - name: Publish verified archive via Trusted Publishing
        shell: bash
        run: |
          archives=(npm-package/*.tgz)
          if [[ ${#archives[@]} -ne 1 || ! -f "${archives[0]}" ]]; then
            echo 'Expected exactly one verified npm archive' >&2
            exit 1
          fi
          npm publish "${archives[0]}" --ignore-scripts --access public
